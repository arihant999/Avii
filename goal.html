<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html,body{
    margin:0;
    padding:0;
    overflow:hidden;
    background:#011425;
}

.wrapper{
    width:100%;
    height:100vh;
    overflow:hidden;
    position:relative;
}

iframe{
    position:absolute;
    top:-80px;   /* YE CROPPING HAI */
    left:0;
    width:100%;
    height:calc(100vh + 80px);
    border:none;
}
</style>
</head>

<body>

<div class="wrapper">
    <iframe src="https://sdvbots.site/goal"></iframe>
</div>

</body>
</html>
